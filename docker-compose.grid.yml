# Selenium Grid for parallel UI runs.
#
# WHY THIS EXISTS
# ---------------
# sessions.yaml declares `local: true`, so Sauron starts a grid on the Jenkins agent itself.
# Selenium sizes a node's session slots from the CPU count, and the agent has 2 CPUs - so it serves
# 2 concurrent sessions while the suite asks for thread-count x data-provider-thread-count. Any
# surplus session never starts, and because Sauron's ScreenshotBddListener then throws on the
# missing driver, the scenario reports "Driver not initialized. Is @WebTest/@MobileTest missing on
# class/method?" instead of the real cause.
#
# Since build #244 that mismatch no longer sinks a run on its own: ci/cap-parallelism.js lowers the
# suite to fit the agent, so an undersized agent is slow rather than red. This file is how you stop
# being slow.
#
# SE_NODE_OVERRIDE_MAX_SESSIONS IS THE POINT
# ------------------------------------------
# The container derives its slots from CPU count exactly like the local grid does. Without the
# override below, running this on a 2-CPU host reproduces the same 2-slot ceiling and nothing is
# fixed. The override is what lets one node hold more sessions than it has cores.
#
# ...WHICH IS NOT A LICENCE TO RUN IT ON THE 2-CPU AGENT
# ------------------------------------------------------
# Slots are bookkeeping; cores are not. Nine headless Chromes on 2 vCPUs will thrash, and the
# failure mode changes from "session not created" to step timeouts - which read as flaky product
# bugs and cost more time than they save. Budget roughly one core and ~1GB of RAM per concurrent
# session, so N sessions wants a host with >=N cores and >=N+3 GB. Run this on a dedicated grid host
# and point GRID_URL at it. Putting it on the build agent moves the bottleneck rather than
# removing it.
#
# USAGE
#   docker compose -f docker-compose.grid.yml up -d
#   curl -s http://<grid-host>:4444/status | jq '.value.ready, .value.nodes[].maxSessions'
#
# The Jenkins job's GRID_URL parameter takes http://<grid-host>:4444 and pre-flights it before
# the suite runs.

services:
  chrome:
    image: selenium/standalone-chrome:4.27.0
    container_name: msme-utaf-grid
    ports:
      - "4444:4444"   # WebDriver endpoint + /status
      - "7900:7900"   # noVNC, for watching a session live while debugging
    environment:
      # Slots. Both are required - MAX_SESSIONS alone is ignored without the override.
      #
      # Overridable, with a default matching the suite's demand at the time of writing (3 x 3 = 9).
      # This was a bare "5" - thread-count's value when the file was written - and was already
      # wrong once the suite moved to 3 x 3. Do not trust the default; check the real figure:
      #
      #     node ci/cap-parallelism.js src/test/resources/testng_bdd.xml --demand
      #
      # then accept it, or pass an explicit value:
      #
      #     GRID_MAX_SESSIONS=12 docker compose -f docker-compose.grid.yml up -d
      SE_NODE_MAX_SESSIONS: "${GRID_MAX_SESSIONS:-9}"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      # A session that outlives the suite holds a slot forever; reclaim it.
      SE_NODE_SESSION_TIMEOUT: "300"
      # Queue rather than reject when every slot is busy, so an extra request from a retry
      # stage waits instead of failing the scenario.
      SE_SESSION_REQUEST_TIMEOUT: "300"
      SE_ENABLE_TRACING: "false"
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
    # Chrome crashes in containers with the default 64MB /dev/shm. --disable-dev-shm-usage is
    # already passed in JSWCapabilitiesBuilder, but a real shm is faster and less fragile.
    shm_size: 2gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 15s
      timeout: 10s
      retries: 10
