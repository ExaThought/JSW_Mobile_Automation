name: PR Checks

# Static gates for every pull request. Nothing here launches a browser or talks to QA, so the
# whole job finishes in about a minute and can safely be a required check on develop.
#
# The four custom checks exist because the framework resolves locator keys, payload keys and step
# text at RUNTIME. A rename or a deletion compiles cleanly and fails much later, in the middle of
# a suite, with a message that names neither the key nor the file that is wrong. Each of these has
# cost a real run in this repo.
#
# A fifth check, ci/check-secrets.js, exists but is not wired in - see the note above the Summary
# step for why, and for how to turn it on.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # Java 11 to match the maven-compiler-plugin configuration (pom.xml <source>/<target>),
      # which is what actually governs the build - not the maven.compiler.* properties above it,
      # which say 18 and disagree.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 24, the active LTS. Node 20 reached end of life on 2026-04-30 and stops receiving
          # security fixes, so pinning it here means the gates run on an unpatched runtime.
          #
          # The ci/ scripts are stdlib-only and the Jenkinsfile's "Node 20 matters" note is
          # about a FLOOR - ci/summarize-allure.js uses optional chaining and nullish
          # coalescing, which are ES2020 - so a newer major is safe.
          #
          # This is the runtime the scripts run ON. It is unrelated to the node20 -> node24
          # move of checkout/setup-java/setup-node above, which is the runtime the ACTIONS
          # themselves run on.
          node-version: '24'

      # ---------------------------------------------------------------------
      # Each step runs even if an earlier one failed, so a PR gets the full
      # picture in one run instead of fixing one thing and discovering the next.
      # ---------------------------------------------------------------------

      # Not offline. "-o" cannot work on a GitHub-hosted runner: ~/.m2 starts empty and
      # "cache: maven" only restores what a previous SUCCESSFUL run saved, so the first run has
      # nothing to read and every later run inherits that failure.
      #
      # The Sauron artifacts live on a private Nexus (master.jswone.in) that answers 401 rather
      # than refusing the connection, so a runner can reach it with credentials. settings.xml in
      # the repo root already declares both server ids; it only needs the values.
      #
      # Create repository secrets NEXUS_USERNAME and NEXUS_PASSWORD. Until they exist this step
      # warns and passes, so the four static checks below still gate the PR instead of every
      # build failing on infrastructure the PR author cannot fix.
      - name: Compile
        id: compile
        if: always()
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [ -z "$NEXUS_USERNAME" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "::warning title=Compile skipped::NEXUS_USERNAME/NEXUS_PASSWORD are not configured, so the Sauron snapshots cannot be resolved. Add them as repository secrets to enable the compile gate."
            exit 0
          fi
          mvn -B -ntp -s settings.xml \
            "-Dnexus-username=$NEXUS_USERNAME" \
            "-Dnexus-password=$NEXUS_PASSWORD" \
            clean compile

      - name: Locator keys resolve
        id: locators
        if: always()
        run: node ci/check-locator-keys.js

      - name: Payload keys resolve
        id: payloads
        if: always()
        run: node ci/check-payload-keys.js

      - name: YAML valid
        id: yaml
        if: always()
        run: |
          pip install --quiet yamllint
          yamllint -c .yamllint.yaml \
            src/test/resources/locators \
            src/test/resources/data \
            src/test/resources/sessions.yaml \
            .github/workflows

      - name: Gherkin lint
        id: gherkin
        if: always()
        run: node ci/lint-features.js

      # ci/check-secrets.js is deliberately NOT wired in here yet.
      #
      # It works - it finds the 36 credentials currently committed in global_*.properties - but
      # those values are what makes the suite run today, and blanking them broke every
      # login-dependent scenario because nothing external supplies them yet. Enabling the gate
      # would just paint every PR red without changing that.
      #
      # Re-enable it in the same change that gives the Jenkins job its credentials bindings:
      #
      #   - name: No committed secrets
      #     id: secrets
      #     if: always()
      #     run: node ci/check-secrets.js
      #
      # Run it by hand any time:  node ci/check-secrets.js

      - name: Summary
        if: always()
        run: |
          {
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Compile | ${{ steps.compile.outcome }} |"
            echo "| Locator keys resolve | ${{ steps.locators.outcome }} |"
            echo "| Payload keys resolve | ${{ steps.payloads.outcome }} |"
            echo "| YAML valid | ${{ steps.yaml.outcome }} |"
            echo "| Gherkin lint | ${{ steps.gherkin.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
