# CCP browser session.
#
# `local: true` makes Sauron start a Selenium Grid on the machine running the suite. Selenium
# sizes a node's session slots from the CPU count, so the 2-CPU Jenkins agent serves 2 concurrent
# sessions while testng_bdd.xml asks for 5. The three surplus sessions never start, and because
# Sauron's ScreenshotBddListener then throws on the absent driver, EVERY scenario reports
# "Driver not initialized. Is @WebTest/@MobileTest missing on class/method?" - a message that
# names neither the browser nor the real cause.
#
# ON JENKINS THIS FILE IS REWRITTEN, NOT EDITED. The Test stage generates a remote-grid version
# in the workspace when the GRID_URL build parameter is set, and otherwise caps the suite's
# thread-count to the agent's CPU count so no thread is left without a slot. The committed
# version below stays `local: true`, which is what a developer clone wants.
#
# TO MOVE TO A REMOTE GRID: docker-compose.grid.yml brings one up with 5 slots, and the Jenkins
# job's GRID_URL parameter pre-flights it (reachable, ready, enough slots) and then points the
# suite at it.
#
# THE KEYS ARE NOW CONFIRMED against the Sauron jar - they are `local`, `protocol`, `host` and
# `port` on the shared SessionConfigData, not a single URL field:
#
#   javap -cp web-4.0.6-SNAPSHOT.jar -p com.qapitol.sauron.common.pojos.SessionConfigData
#     -> private String protocol / private String host / private int port / private boolean local
#   javap -cp web-4.0.6-SNAPSHOT.jar -p -c com.qapitol.sauron.web.sessions.WebTestSession
#     -> createDriverUrl() calls getProtocol(), getHost(), getPort() and hands them to
#        getURLFromData(protocol, host, port); the defaults are localhost:4444
#
# So a remote session is:
#
#   - name: "ccp"
#     local: false
#     protocol: "http"
#     host: "grid.internal.example"
#     port: 4444
#     platform: "chrome"
#     browserRunHeadless: true
#
# Still true that a wrong key is silently ignored and Sauron falls back to a local grid, which is
# why the four above were read out of the jar rather than guessed.
- name: "ccp"
  local: true
  platform: "chrome"
  browserRunHeadless: true
