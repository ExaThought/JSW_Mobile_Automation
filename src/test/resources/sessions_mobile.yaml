# Real Android device (USB debugging) + native JSW One MSME app.
# Device details captured via: adb devices -l / getprop / dumpsys
# Appium server must be running at http://127.0.0.1:4723 before tests start.
 
- name: "android_chrome"
  local: true
  platform: "android"
  browserName: "Chrome"
  deviceName: "SM-E625F"                  # ro.product.model
  udid: "RZ8R60XN6TX"                     # adb serial (adb devices)
  platformVersion: "13"                   # ro.build.version.release
  automationName: "UiAutomator2"
  appiumServerUrl: "http://127.0.0.1:4723"
  browserRunHeadless: false
 
  # Native app under test (only used by app-level tests; Chrome tests ignore these)
  appPackage: "com.constructone.mobile.retailer.qa"
  appActivity: "com.constructone.mobile.retailer.MainActivity"
  appVersion: "2.180.0"
  noReset: true                           # keep login/session between runs
 
