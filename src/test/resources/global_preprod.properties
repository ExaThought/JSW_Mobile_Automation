# TODO: every value below is carried over from global_qa and is UNVERIFIED on pre-prod. They are
# present rather than omitted so the suite fails on a rejected login - which names the account -
# instead of on a null credential, which does not. Replace them with real pre-prod values, or
# inject them through the environment variables named in each placeholder.
account.login.email=${LOGIN_ACCOUNT_EMAIL:testautomation01@yopmail.com}
account.login.password=${LOGIN_ACCOUNT_PASSWORD:Jsw@2025}
