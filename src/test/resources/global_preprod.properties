# --- User pool for parallel execution: one dedicated user per test group ---
#
# NOT SAFE TO RUN IN PARALLEL YET. Despite the heading, login, homepage, cart, orders and pdpplp
# below all resolve to testautomation01@yopmail.com - five of the seven active blocks in
# testng_bdd.xml on ONE customer. That suite pins no environment, so -Denv=preprod runs it at
# thread-count 5, and because CCP logout is SERVER-SIDE and Hooks.afterScenario logs out after
# every scenario, those five blocks will log each other out continuously. The failures look like
# random "session expired" product bugs.
#
# Give each group its own pre-prod account - the qa file has the pattern, one jswtest.in address
# per group - or run pre-prod serially, before pointing testng_bdd.xml at this environment.
#
# CCP login / registration / forgot-password (testng_bdd.xml <test name="Login">).
# Needed because CcpRegistrationSteps calls ApiUtils.isGstinNotExists(), and Token.getCCPToken()
# resolves its credential from the GROUP rather than from account.login.*.
login.user.email=${PREPROD_LOGIN_USER:testautomation01@yopmail.com}
login.user.password=${PREPROD_LOGIN_PASSWORD:Jsw@2025}

