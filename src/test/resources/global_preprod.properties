# =============================================================================
# PRE-PROD environment
# Selected with:  -Denv=preprod    (or ENV=preprod, or <parameter name="env" value="preprod"/>)
# Every ${VAR:default} can be overridden by an OS environment variable of that
# name - that is the mechanism Jenkins should use to inject secrets.
# =============================================================================

# --- CCP ---
sfUrl=${SF_BASE_URL:https://tms.preprod.jswonemsme.com/}
middlewareUrl=${MIDDLEWARE_BASE_URL:https://experience-middleware.preprod.jswonemsme.com/}
ccpUrl=${CCP_BASE_URL:https://preprod.jswonemsme.com/}
ccpPortalUrl=${CCP_PORTAL_URL:https://preprod.jswonemsme.com/}
# TODO: supply the PRE-PROD central-cart host. Left commented because the previous value was the
# QA host (https://qa.msme.jswone.in/central-cart/api/internal/) and the pre-prod equivalent is
# not known here - guessing it would send cart writes at the wrong environment, which is worse
# than not resolving. Set CENTRAL_CART_URL, or uncomment with the correct host.
# Until then LoginApiImpl and BaseApiImpl.centralCartCcpUrl() report a clear "not configured"
# message instead of a NullPointerException.
#centralCartCcpUrl=${CENTRAL_CART_URL:https://<preprod-central-cart-host>/central-cart/api/internal/}
# Salesforce -> CT sales-opp sync (data-sync/import/sales-opp).
# Pre-prod has no separate host for it, so this stays on ccpUrl and keeps the existing
# access_token auth. Point it at a dedicated host BEFORE setting salesOppApiKey below.
salesOppUrl=${SALES_OPP_BASE_URL:https://preprod.jswonemsme.com/}
# These five were pointing at qa-ssr.msme.jswone.in, so every pre-prod run that opened the
# ledger, cart, orders, profile or tracking page silently drove the QA site while the rest of
# the suite ran against pre-prod. Each is ccpUrl + a fixed path, exactly as in global_qa.
# All five verified to return HTTP 200 on the pre-prod host.
ledgerUrl=${LEDGER_BASE_URL:https://preprod.jswonemsme.com/ledger}
cartUrl=${CART_BASE_URL:https://preprod.jswonemsme.com/cart-detail}
orderPageUrl=${ORDER_PAGE_BASE_URL:https://preprod.jswonemsme.com/my-orders?tab=all}
profileUrl=${PROFILE_BASE_URL:https://preprod.jswonemsme.com/my-profile}
materialTrackingUrl=${MATERIAL_TRACKING_BASE_URL:https://preprod.jswonemsme.com/track-material}
SEOEnv=preprod

# --- Secrets / tokens ---
# NO VALUE BELONGS ON THE RIGHT OF A COLON IN THIS SECTION. Every key here is
# ${ENV_VAR:} with an EMPTY default, so a missing secret fails loudly through
# ConfigUtil.resolveOrThrow instead of silently running with a committed one.
# Supply them as environment variables - GitHub Actions secrets, or Jenkins
# credentials bindings. See README.md "Required secrets" for the full list.
# ci/check-secrets.js fails the build if a real value reappears here.
# TODO: confirm this is the PRE-PROD key. It is byte-identical to the one in global_qa, which is
# either correct (one key spans both) or a copy that was never updated. Only read by LoginApiImpl
# for the central-cart client, which is unreachable here while centralCartCcpUrl is unset.
XApiKey=${X_API_KEY:}
# Left EMPTY on purpose. salesOppUrl above is the same address as ccpUrl here, and the
# API client is shared per address - setting a key would swap access_token for X-API-KEY
# on every CCP call, not just sales-opp. Supply the pre-prod key together with a
# dedicated SALES_OPP_BASE_URL.
salesOppApiKey=${SALES_OPP_API_KEY:}
# Commented out rather than corrected. Three independent reasons, any one of which is enough:
#   1. no code reads this property - it is dead configuration
#   2. its userId is 1834a7bb-e285-4744-911d-e15b4e2b1bc0, the QA automation user
#   3. it expired on 2026-06-16
# Restore it only with a real pre-prod token, and only if something starts consuming it.
#customerPortalAuthToken=${CUSTOMER_PORTAL_AUTH_TOKEN:}
ccpExpiredToken=${CCP_EXPIRED_TOKEN:}

# --- ERP / OMS ---
omsBaseUrl=${OMS_BASE_URL:https://oms.preprod.jswonemsme.com/}
omsUrl=${OMS_BASE_URL:https://oms.preprod.jswonemsme.com/}
oms.user.email=${OMS_USER_EMAIL:}
oms.user.password=${OMS_USER_PASSWORD:}
omsAuthToken=${OMS_TOKEN:}
ErpLoginAuth=${OMS_LOGIN:}

# --- OMS database (JDBC) ---
# TODO: confirm this is the PRE-PROD database. Host, schema, user and password are all identical
# to global_qa, so a pre-prod run currently reads whatever database QA reads. If that is wrong,
# every DB-backed assertion on pre-prod is checking the other environment's rows. Not changed
# here because the pre-prod connection details are not known - set OMS_DB_* to override.
OMS_URL=${OMS_DB_URL:jdbc:postgresql://34.93.219.164:5432}
OMS_SCHEMA_NAME=${OMS_DB_SCHEMA:oms2}
OMS_USERID=${OMS_DB_USER:omsuser}
OMS_PWD=${OMS_DB_PASSWORD:}

# --- Named accounts for the login / registration / forgot-password suites ---
# Resolved by UserConfig.getAccountEmail("<alias>") / getAccountPassword("<alias>"), so the
# feature files name the ACCOUNT and never carry a credential.
#
# TODO: the ADDRESSES below are carried over from global_qa and are UNVERIFIED on pre-prod.
# Replace them with real pre-prod accounts.
# Passwords are intentionally empty - supply them through the environment variables named in
# each placeholder. UserConfig.requireGroupValue and ConfigUtil.resolveOrThrow both fail naming
# the missing key, so an unset password reports itself rather than surfacing as a null.
account.login.email=${LOGIN_ACCOUNT_EMAIL:testautomation01@yopmail.com}
account.login.password=${LOGIN_ACCOUNT_PASSWORD:}
# Deliberately wrong - used to prove a bad password is rejected. Env-independent.
account.login.wrongPassword=${LOGIN_ACCOUNT_WRONG_PASSWORD:deliberately-invalid-not-a-real-password}
account.registered.email=${REGISTERED_ACCOUNT_EMAIL:testautomation01@yopmail.com}
# Must NOT be registered - proves forgot-password does not reveal which addresses have accounts.
account.unregistered.email=${UNREGISTERED_ACCOUNT_EMAIL:not-a-registered-user-9f2c@yopmail.com}
account.newRegistration.email=${NEW_REGISTRATION_EMAIL:indresh.kumarallen@gmail.com}
# These must genuinely already exist in PRE-PROD for the duplicate-account scenarios to mean
# anything - a mobile or GSTIN that only exists on QA makes those two scenarios assert nothing.
account.existing.mobile=${EXISTING_ACCOUNT_MOBILE:8318219436}
account.existing.gstin=${EXISTING_ACCOUNT_GSTIN:27AADCL2102L1ZQ}

