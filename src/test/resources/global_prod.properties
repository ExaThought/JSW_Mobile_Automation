# =============================================================================
# PRODUCTION environment
# Selected with:  -Denv=prod    (or ENV=prod, or <parameter name="env" value="prod"/>)
#
# READ THIS BEFORE EDITING
# ------------------------
# This file backs a READ-ONLY sanity suite (testng_prod_sanity.xml, tag
# @productionSanity). Production carries real customers, real money and real
# fulfilment, so the guiding rule here is:
#
#     anything that can CREATE a business record is deliberately absent.
#
# Order creation, ERP/OMS, the OMS database and the central-cart internal API
# have NO values below. That is not an oversight - it is the second barrier
# behind the tag filter. If an order-creation scenario ever reaches production
# through a tagging mistake, it fails on missing configuration instead of
# placing a real order that a customer gets invoiced for.
#
# Do not "complete" this file by copying values from global_qa.properties.
# =============================================================================

# --- CCP (read-only browsing and login) ---
ccpUrl=${CCP_BASE_URL:https://www.jswonemsme.com/}
ccpPortalUrl=${CCP_PORTAL_URL:https://www.jswonemsme.com/}
ledgerUrl=${LEDGER_BASE_URL:https://www.jswonemsme.com/ledger}
cartUrl=${CART_BASE_URL:https://www.jswonemsme.com/cart-detail}
orderPageUrl=${ORDER_PAGE_BASE_URL:https://www.jswonemsme.com/my-orders?tab=all}
profileUrl=${PROFILE_BASE_URL:https://www.jswonemsme.com/my-profile}
materialTrackingUrl=${MATERIAL_TRACKING_BASE_URL:https://www.jswonemsme.com/track-material}

# Drives the robots/canonical expectations in SeoSteps. On production the pages MUST be
# "index, follow" - a noindex leaking to production removes the site from Google, which is
# the single highest-impact thing this suite checks and is invisible on qa/preprod.
SEOEnv=${SEO_ENV:prod}

# --- Not configured on purpose ---------------------------------------------
# sfUrl                 Salesforce TMS. Nothing in the read-only suite calls it.
# middlewareUrl         experience-middleware host. The production hostname is not known here,
#                       and guessing it would silently point the customer-profile API at
#                       nothing. Set MIDDLEWARE_BASE_URL and the customer-profile scenarios
#                       become runnable; until then leave them out of the prod suite.
# centralCartCcpUrl     central-cart INTERNAL api - writes carts. Must stay unset.
# salesOppUrl           data-sync/import/sales-opp - CREATES REAL ORDERS. Must stay unset.
# salesOppApiKey        service key for the above. Must stay unset.
# XApiKey               only consumed by the central-cart client, which is unreachable here.
# omsBaseUrl / omsUrl   ERP. Read-only in theory, but the ERP steps are only reached from
#                       order-creation scenarios, which never run here.
# omsAuthToken          ERP service token.
# ErpLoginAuth          ERP UI login redirect.
# OMS_URL / OMS_SCHEMA_NAME / OMS_USERID / OMS_PWD
#                       production OMS database. Automation must never hold prod DB
#                       credentials; every DB-backed assertion is excluded from this suite.
# ccpExpiredToken       token-expiry scenarios are excluded - they deliberately drive an
#                       invalid session, which is not something to do against production.
# ---------------------------------------------------------------------------

# --- Named accounts --------------------------------------------------------
# EMPTY ON PURPOSE. There are no real production credentials in this repo, and copying the
# QA ones would either fail confusingly or lock a real account. Supply them through the
# Jenkins credentials named in each placeholder.
#
# UserConfig.requireGroupValue / requireAccountValue fail with a message naming the exact
# key, so an unset value produces one clear error rather than a NullPointerException.
#
# The account MUST be read-only by policy: used for monitoring, never for ordering.
# Same two placeholders as the user pool below, so ONE pair of Jenkins credentials
# (msme-prod-monitor-user / msme-prod-monitor-password) supplies everything and the
# pipeline never has to interpolate a secret into a Groovy string.
account.login.email=${PROD_MONITOR_USER:}
account.login.password=${PROD_MONITOR_PASSWORD:}
# Deliberately wrong - proves a bad password is rejected. Env-independent, so it has a value.
account.login.wrongPassword=${PROD_LOGIN_ACCOUNT_WRONG_PASSWORD:JswOne@NotAValidPassword2029}
# Must NOT be registered on production - proves forgot-password does not reveal which
# addresses have accounts. A yopmail address is safe: nothing is ever sent to a real person.
account.unregistered.email=${PROD_UNREGISTERED_ACCOUNT_EMAIL:not-a-registered-user-9f2c@yopmail.com}

# Not set for production:
#   account.registered.email    - the forgot-password confirmation scenario SENDS A REAL EMAIL
#                                 to that address, so it is excluded from the prod suite.
#   account.newRegistration.*   - registration creates real customer accounts.
#   account.existing.mobile     - only used by duplicate-registration scenarios.
#   account.existing.gstin

# --- User pool -------------------------------------------------------------
# One read-only monitoring account for every group, unlike qa/preprod where the pool exists
# to keep parallel groups from corrupting each other's cart. Nothing here writes, so there is
# nothing to isolate - and one production account is one thing to audit rather than eight.
login.user.email=${PROD_MONITOR_USER:}
login.user.password=${PROD_MONITOR_PASSWORD:}
homepage.user.email=${PROD_MONITOR_USER:}
homepage.user.password=${PROD_MONITOR_PASSWORD:}
pdpplp.user.email=${PROD_MONITOR_USER:}
pdpplp.user.password=${PROD_MONITOR_PASSWORD:}
orders.user.email=${PROD_MONITOR_USER:}
orders.user.password=${PROD_MONITOR_PASSWORD:}
profile.user.email=${PROD_MONITOR_USER:}
profile.user.password=${PROD_MONITOR_PASSWORD:}
Guest.user.email=${PROD_MONITOR_USER:}
Guest.user.password=${PROD_MONITOR_PASSWORD:}

# Not set: cart.user.*, tokencheck.user.*, msite.user.*, secondary.user.* - no group in the
# production suite runs under them, and an unused production credential is a liability.
