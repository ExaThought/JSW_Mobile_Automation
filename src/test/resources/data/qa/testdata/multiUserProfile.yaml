# Expected COMPANY details on an additional user's profile page.
#
# WHY ONLY COMPANY FIELDS. The additional user's personal details - name, email, phone - are
# generated by the run itself at invitation time and asserted straight from ScenarioContext, so
# they need no data file and carry none of the "the signed-in account must be the customer this
# file describes" coupling. The COMPANY is the opposite: an additional user inherits it from the
# primary account, which this run did not create and which differs per environment - so it is
# bound here, by test case id, exactly as customerDetails.yaml does.
#
# The customer described here must be the one account.primaryUser.* signs in as. Re-point both
# together or every company assertion below fails against a real, correct page.
#
# ON MISSING VALUES: CustomerDetailSteps.assertField treats an absent key as presence-only - it
# asserts the field is displayed, logs that no expected value was configured, and moves on. So an
# unfilled key below weakens the check but does not fail the run.
- testCaseId: "multiuser-profile-001"
  # Read off the QA primary account (arush@yopmail.com -> Bisleri international pvt ltd).
  gstin: "09AACCA4355K1ZJ"
  # Characters 3-12 of the GSTIN are the PAN, which is also what the cross-field invariant
  # "the displayed GSTIN should contain the displayed PAN" checks on screen.
  pan: "AACCA4355K"
  # NOT FILLED IN: the exact strings the Company details section renders were not verified, and a
  # wrong expected value fails against a correct page - which is worse than presence-only. Take
  # them from the profile page and paste them here.
  # company_name: ""
  # address: ""
