profile.user.email=${QA_PROFILE_USER:qa_profile_user@yopmail.com}
profile.user.password=${QA_PROFILE_PASSWORD:Jsw@2026}

# Token-expiry scenarios. Runs <test name="TokenCheck">: @tokenCheckLogin - kept as its own group
# rather than reusing profile, so that repointing one never silently repoints the other.
#
# STILL SHARES testautomation01 WITH <test name="Login"> (account.login.* and login.user.*). No
# qa_tokencheck_user account was supplied, and inventing one would fail at login with a
# credential that does not exist, so it is left on the account known to work. That is safe only
