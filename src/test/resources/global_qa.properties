# Runs <test name="Profile">: @customerDetails or @EmptyBankDetails - and the group also backs
# Address, bankDetails and forgetPassword when those tags are added to the block.
#
# Now on its own account. It previously pointed at testpre_prod12as@gmail.com, which has no QA
