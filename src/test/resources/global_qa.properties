# Must be a REGISTERED address: the forgot-password flow is asserted against it.
account.registered.email=${REGISTERED_ACCOUNT_EMAIL:testautomation01@yopmail.com}
# Must NOT be registered - proves forgot-password does not reveal which addresses have accounts.
account.unregistered.email=${UNREGISTERED_ACCOUNT_EMAIL:not-a-registered-user-9f2c@yopmail.com}
# Used to reach the registration form. Not submitted, so it does not need to stay unused.
