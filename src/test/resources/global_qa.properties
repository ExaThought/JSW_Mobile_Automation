# =============================================================================
# QA environment  (DEFAULT - used when no env is supplied)
# Selected with:  -Denv=qa    (or ENV=qa, or <parameter name="env" value="qa"/>)
# Every ${VAR:default} can be overridden by an OS environment variable of that
# name - that is the mechanism Jenkins should use to inject secrets.
# =============================================================================

# --- CCP ---
sfUrl=${SF_BASE_URL:https://tms.qa.jswone.in/}
middlewareUrl=${MIDDLEWARE_BASE_URL:https://experience-middleware.qa.jswone.in/}
ccpUrl=${CCP_BASE_URL:https://qa-ssr.msme.jswone.in/}
ccpPortalUrl=${CCP_PORTAL_URL:https://qa-ssr.msme.jswone.in/}
centralCartCcpUrl=${CENTRAL_CART_URL:https://qa.msme.jswone.in/central-cart/api/internal/}
# Salesforce -> CT sales-opp sync (data-sync/import/sales-opp).
# Deliberately NOT ccpUrl: on QA this endpoint lives on qa.msme.jswone.in and is
# authenticated with the service key below instead of a user access_token.
salesOppUrl=${SALES_OPP_BASE_URL:https://qa.msme.jswone.in/}
ledgerUrl=${LEDGER_BASE_URL:https://qa-ssr.msme.jswone.in/ledger}
cartUrl=${CART_BASE_URL:https://qa-ssr.msme.jswone.in/cart-detail}
orderPageUrl=${ORDER_PAGE_BASE_URL:https://qa-ssr.msme.jswone.in/my-orders?tab=all}
profileUrl=${PROFILE_BASE_URL:https://qa-ssr.msme.jswone.in/my-profile}
materialTrackingUrl=${MATERIAL_TRACKING_BASE_URL:https://qa-ssr.msme.jswone.in/track-material}
SEOEnv=${SEO_ENV:qa}

# --- Secrets / tokens ---
# NO VALUE BELONGS ON THE RIGHT OF A COLON IN THIS SECTION. Every key here is
# ${ENV_VAR:} with an EMPTY default, so a missing secret fails loudly through
# ConfigUtil.resolveOrThrow instead of silently running with a committed one.
# Supply them as environment variables - GitHub Actions secrets, or Jenkins
# credentials bindings. See README.md "Required secrets" for the full list.
# ci/check-secrets.js fails the build if a real value reappears here.
XApiKey=${X_API_KEY:}
# X-API-KEY for the sales-opp sync. When set, it REPLACES access_token on every call
# made through salesOppUrl - so only set it when salesOppUrl is a host of its own.
salesOppApiKey=${SALES_OPP_API_KEY:}
# Commented out: no code reads this property, and the token expired on 2026-06-16.
# Restore it only if something starts consuming it, with a fresh token.
#customerPortalAuthToken=${CUSTOMER_PORTAL_AUTH_TOKEN:}
# A DELIBERATELY EXPIRED CCP token - CustomerProfileApiSteps sends it to prove the
# API answers 401. It is test data rather than a live credential, but it is still a
# real signed JWT carrying a real userId, so it is injected like any other secret.
# @customerProfileApi needs CCP_EXPIRED_TOKEN set; without it the scenario fails
# naming the variable.
ccpExpiredToken=${CCP_EXPIRED_TOKEN:}

# --- ERP / OMS ---
omsBaseUrl=${OMS_BASE_URL:https://qa-oms.msme.jswone.in/}
omsUrl=${OMS_BASE_URL:https://qa-oms.msme.jswone.in/}
oms.user.email=${OMS_USER_EMAIL:}
oms.user.password=${OMS_USER_PASSWORD:}
# OMS bearer token. Prefer leaving OMS_TOKEN unset and supplying oms.user.* instead:
# Token.getOmsToken then logs in and caches a fresh token, so nothing long-lived is stored.
omsAuthToken=${OMS_TOKEN:}
# The ERP hand-off URL embeds the same OMS token as a query parameter. Built from
# omsBaseUrl + omsErpRedirectPath + getOmsToken() when OMS_LOGIN is unset, so the
# token is never written down.
ErpLoginAuth=${OMS_LOGIN:}

# --- OMS database (JDBC) ---
OMS_URL=${OMS_DB_URL:jdbc:postgresql://34.93.219.164:5432}
OMS_SCHEMA_NAME=${OMS_DB_SCHEMA:oms2}
OMS_USERID=${OMS_DB_USER:omsuser}
OMS_PWD=${OMS_DB_PASSWORD:}

# --- Named accounts for the login / registration / forgot-password suites ---
# Resolved by UserConfig.getAccountEmail("<alias>") / getAccountPassword("<alias>"), so the
# feature files name the ACCOUNT and never carry a credential. Every value is env-specific:
# an address that exists on QA does not necessarily exist on pre-prod.
account.login.email=${LOGIN_ACCOUNT_EMAIL:testautomation01@yopmail.com}
account.login.password=${LOGIN_ACCOUNT_PASSWORD:}
# Deliberately wrong - used to prove a bad password is rejected.
account.login.wrongPassword=${LOGIN_ACCOUNT_WRONG_PASSWORD:deliberately-invalid-not-a-real-password}
# Must be a REGISTERED address: the forgot-password flow is asserted against it.
account.registered.email=${REGISTERED_ACCOUNT_EMAIL:testautomation01@yopmail.com}
# Must NOT be registered - proves forgot-password does not reveal which addresses have accounts.
account.unregistered.email=${UNREGISTERED_ACCOUNT_EMAIL:not-a-registered-user-9f2c@yopmail.com}
# Used to reach the registration form. Not submitted, so it does not need to stay unused.
account.newRegistration.email=${NEW_REGISTRATION_EMAIL:indresh.kumarallen@gmail.com}
# Existing values used to assert duplicate-account rejection. These must genuinely already exist
# in THIS environment, which is why they are not hardcoded in the feature file.
account.existing.mobile=${EXISTING_ACCOUNT_MOBILE:8318219436}
account.existing.gstin=${EXISTING_ACCOUNT_GSTIN:27AADCL2102L1ZQ}

