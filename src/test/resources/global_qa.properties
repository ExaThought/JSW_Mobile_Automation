account.existing.gstin=${EXISTING_ACCOUNT_GSTIN:27AADCL2102L1ZQ}

# Primary user of a multi-user account. features/multiUser/primaryUserLogin.feature names this
# account as "primaryUser" and never carries the credential itself.
