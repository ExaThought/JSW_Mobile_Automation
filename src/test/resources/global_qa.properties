# --- User pool for parallel execution: one dedicated user per test group ---
# homepage, cart, pdpplp, orders and profile have dedicated jswtest.in accounts; login,
# tokencheck, Guest and msite are still on the older shared/pre-prod addresses.
# orders.user.* is matched to the CustomerId in data/qa/testdata/sfslcslo.yaml - see the note
# above that key before changing either one.
#
# TWO BLOCKS THAT CAN RUN AT THE SAME TIME MAY NOT SHARE AN ACCOUNT. testng_bdd.xml runs at
# thread-count 5, and CCP logout is SERVER-SIDE: Hooks.afterScenario clicks Log out after every
# scenario, so a second block signed in as the same customer loses its session mid-scenario and
# fails with what looks like a random "session expired" product bug. The rule covers the
# account.* keys above as well - account.login.* is the address <test name="Login"> actually
# drives in a browser, so it must differ from every group account too.
#
# CCP login / registration / forgot-password (testng_bdd.xml <test name="Login">).
# The scenarios themselves name accounts through account.login.* and never read these keys - but
# CcpRegistrationSteps calls ApiUtils.isGstinNotExists(), which needs a CCP token, and
# Token.getCCPToken() resolves the credential from the GROUP. Without this pair the whole block
# fails with "Unknown test.group 'login'" before any registration assertion runs.
# Same account as account.login.* so the API token belongs to the user the UI logs in as.
login.user.email=${QA_LOGIN_USER:testautomation01@yopmail.com}
login.user.password=${QA_LOGIN_PASSWORD:Jsw@2025}

# Runs <test name="Homepage">: @header or @footer or @blogs or @search
homepage.user.email=${QA_HOMEPAGE_USER:qa_homepage_user@jswtest.in}
homepage.user.password=${QA_HOMEPAGE_PASSWORD:Jsw@2026}

# Runs <test name="Cart_AddToCartAndCreateOpportunity">
cart.user.email=${QA_CART_USER:qa_cart_user@jswtest.in}
cart.user.password=${QA_CART_PASSWORD:Jsw@2026}

# PDP/PLP browsing (testng_bdd.xml <test name="PDP_PLP">). The group was already listed in
# UserConfig.VALID_GROUPS and in the suite, but these two keys did not exist - so the credential
