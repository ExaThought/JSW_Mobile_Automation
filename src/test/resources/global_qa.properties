tokencheck.user.password=${QA_TOKENCHECK_PASSWORD:Jsw@2025}

# Runs <test name="SF_SLC_SLO">: @slcOrderCreation or @sloOrderCreation
#
# This account is COUPLED to data/qa/testdata/sfslcslo.yaml, which now pins CustomerId to
# 5bd5c9bc-04ad-4a2b-8dbb-2e70e70656a0 and AddressId to 01QL_kRz - qa_orders_user@jswtest.in.
# The SLC cart is created through the API for the CustomerId in that yaml, then the browser
# logs in as orders.user.email and opens the cart. Point the two at different customers and the
# API builds a cart for one while the browser opens the other's EMPTY cart, so every SLC/SLO
# scenario fails on an empty cart rather than on a product defect.
