# --- Named accounts for the login / registration / forgot-password suites ---
# Resolved by UserConfig.getAccountEmail("<alias>") / getAccountPassword("<alias>"), so the
# feature files name the ACCOUNT and never carry a credential. Every value is env-specific:
# an address that exists on QA does not necessarily exist on pre-prod.
account.login.email=${LOGIN_ACCOUNT_EMAIL:testautomation01@yopmail.com}
account.login.password=${LOGIN_ACCOUNT_PASSWORD:Jsw@2025}
# Deliberately wrong - used to prove a bad password is rejected.
account.login.wrongPassword=${LOGIN_ACCOUNT_WRONG_PASSWORD:Jsw@2029}
# Must be a REGISTERED address: the forgot-password flow is asserted against it.
account.registered.email=${REGISTERED_ACCOUNT_EMAIL:testautomation01@yopmail.com}
# Must NOT be registered - proves forgot-password does not reveal which addresses have accounts.
account.unregistered.email=${UNREGISTERED_ACCOUNT_EMAIL:not-a-registered-user-9f2c@yopmail.com}
# Used to reach the registration form. Not submitted, so it does not need to stay unused.
account.newRegistration.email=${NEW_REGISTRATION_EMAIL:indresh.kumarallen@gmail.com}
# Existing values used to assert duplicate-account rejection. These must genuinely already exist
# in THIS environment, which is why they are not hardcoded in the feature file.
account.existing.mobile=${EXISTING_ACCOUNT_MOBILE:8318219436}
account.existing.gstin=${EXISTING_ACCOUNT_GSTIN:27AADCL2102L1ZQ}

# --- User pool for parallel execution: one dedicated user per test group ---
# homepage, cart, pdpplp and orders now have dedicated jswtest.in accounts; login, tokencheck,
# Guest, profile, secondary and msite are still on the older shared/pre-prod addresses.
# orders.user.* is matched to the CustomerId in data/qa/testdata/sfslcslo.yaml - see the note
# above that key before changing either one.
#
# CCP login / registration / forgot-password (testng_bdd.xml <test name="Login">).
# The scenarios themselves name accounts through account.login.* and never read these keys - but
# CcpRegistrationSteps calls ApiUtils.isGstinNotExists(), which needs a CCP token, and
# Token.getCCPToken() resolves the credential from the GROUP. Without this pair the whole block
# fails with "Unknown test.group 'login'" before any registration assertion runs.
# Same account as account.login.* so the API token belongs to the user the UI logs in as.
login.user.email=${QA_LOGIN_USER:testautomation01@yopmail.com}
login.user.password=${QA_LOGIN_PASSWORD:Jsw@2025}

# Runs <test name="Homepage">: @header or @footer or @blogs or @search
homepage.user.email=${QA_HOMEPAGE_USER:qa_homepage_user@jswtest.in}
homepage.user.password=${QA_HOMEPAGE_PASSWORD:Jsw@2026}

# Runs <test name="Cart_AddToCartAndCreateOpportunity">
cart.user.email=${QA_CART_USER:qa_cart_user@jswtest.in}
cart.user.password=${QA_CART_PASSWORD:Jsw@2026}

# PDP/PLP browsing (testng_bdd.xml <test name="PDP_PLP">). The group was already listed in
# UserConfig.VALID_GROUPS and in the suite, but these two keys did not exist - so the credential
