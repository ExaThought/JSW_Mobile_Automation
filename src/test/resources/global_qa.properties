#
# data/qa/testdata/ccpErpSync.yaml carries the SAME CustomerId and AddressId. The reference
# block at the foot of testng_bdd.xml assigns @ccpErpSyncRegression to this group, so it shares
# the coupling even though no active <test> block selects it yet - keep the three files in step.
#
# data/qa/testdata/rcv2.yaml still holds the old id (1834a7bb-..., testautomation01). It runs
# under the api group with no browser login, so this key does not affect it. Update it only if
# testautomation01 is being retired outright.
