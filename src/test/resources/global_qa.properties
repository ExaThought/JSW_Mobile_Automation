# --- Expired invitation, for features/multiUser/InvitationToAdditionalUsers.feature ---
#
# An invitation cannot be aged out inside a test run, so the @invitationExpired scenarios work
# from an invitation that is ALREADY past its window - the same approach ccpExpiredToken takes
# above rather than waiting out a real expiry.
#
# SHIPS EMPTY ON PURPOSE. A wrong-but-present link would fail the scenario looking like a product
# defect; an empty one fails with ConfigUtil's message naming the variable to set. To populate it:
# invite a user, let the invitation lapse (or expire it directly in the CCP data store), then put
# the invitation URL here and the invited address in the second key so the status scenario knows
# which row to look for.
invitation.expired.link=${INVITATION_EXPIRED_LINK:}
invitation.expired.email=${INVITATION_EXPIRED_EMAIL:}

# Password the invited user sets when accepting an invitation.
#
# Configured rather than generated on purpose: an invitee whose password nobody recorded cannot be
# signed in as afterwards, and signing in as them is the only way to prove the activation worked.
# Not a secret - it belongs to a throwaway autogen@yopmail.com account created by the run itself.
invitation.newUser.password=${INVITATION_NEW_USER_PASSWORD:Jsw@2026}
