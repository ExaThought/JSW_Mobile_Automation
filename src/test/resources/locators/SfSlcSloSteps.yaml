    en_US:
      web: //span[contains(text(),'Thickness')]/following-sibling::span[@class='attribute-value']
  cartLineItemWidth:
    en_US:
      web: //span[contains(text(),'Width')]/following-sibling::span[@class='attribute-value']
  cartLineItemLength:
