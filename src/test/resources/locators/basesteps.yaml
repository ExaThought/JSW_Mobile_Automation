elements:
  windowKeys:
    en_US:
      web: xpath=.//div[@class=' record-label-name']
  windowValues:
    en_US:
      web: xpath=.//div[contains(@class,'record-summary-data')]
  loader:
    en_US:
      web: //div[@class='loader']
  clearSearch:
    en_US:
      web: css=i#cancelCriteria
  preLoader:
    en_US:
      web: //*[@id='preloader']
  rightPanel:
    en_US:
      web: >
        //*[@class='zc-right-panel zc-report-adv-search'][@style='display: block;']
  searchIcon:
    en_US:
      web: //*[@elname='zc-showSearchDivEl']
  searchList:
    en_US:
      web: css=#searchlist
  searchCheckbox:
    en_US:
      web: //div[@class=''zc-cb-checkbox''][label[contains(text(),''{0}'')]]//input
  searchInput:
    en_US:
      web: //li[contains(@class,''zc-cb-checkbox-selected zc-active-search-block'')][*//label[contains(text(),''{0}'')]]//*[@class=''adv-search-textfield'']//input[@class]
  searchDropDownListOption:
    en_US:
      web: //li/div[text()=''{0}'']
  searchDropDownSelectOption:
    en_US:
      web: //li/div[contains(normalize-space(),''{0}'') or span[contains(normalize-space(),''{1}'')]]
  searchIndexFirst:
    en_US:
      web: //ul[@class='select2-results']/li
  searchButton:
    en_US:
      web: //*[@class='zc-cb-footer']//a[text()='Search']
  totalRows:
    en_US:
      web: //tbody/tr[@elname='zc-reportRowEl' and (not(@class) or normalize-space(@class)='')]
  selectRow:
    en_US:
      web: //tr[td[contains(text(),''{0}'')]]
  dataWindow:
    en_US:
      web: //div[@class='record-summary']/div
  popupClose:
    en_US:
      web: //span[@class='popupClose']
  baseTable1:
    en_US:
      web: //*[@id="listReportMainContainer"]/div[1]/div/div/div/table
  baseTable2:
    en_US:
      web: //*[@id="listReportMainContainer"]/div[2]/div/div/div/table
  headerCells:
    en_US:
      web: xpath=.//thead/tr//th[@searchallowed='true']
  rowCells:
    en_US:
      web: xpath=.//td[contains(@class,'zc-mapping-field')]