elements:

  # ================= CUSTOMER MENU =================

  ccpUserMenuTestacco:
    en_US:
      web: //span[contains(normalize-space(),'Testauto')]

  ccpUserMenuProfileOption:
    en_US:
      web: //a[contains(@class,'user-dropdown-item') and normalize-space()='Profile']


  # ================= BANK TAB =================

  bankAccountDetailsTab:
    en_US:
      web: //button[text()='Bank account details']



  # ================= BANK DETAILS VALUES =================

  gstinNameValue:
    en_US:
      web: //div[text()='GSTIN name:']/following-sibling::div

  accountHolderNameValue:
    en_US:
      web: (//div[@data-slot="card-content"]//div[@class='flex'][2]//div)[2]

  bankAccountNumberValue:
    en_US:
      web: //span[text()='Bank account number']/following-sibling::span

  ifscCodeValue:
    en_US:
      web: //span[text()='IFSC code']/following-sibling::span

  replaceBankAccountButton:
    en_US:
      web: //div[normalize-space()='Replace bank account']

    enterBankAccountHeading:
      en_US:
        web: //div[normalize-space()='Enter bank account information']
  emptyBankDetailsTitle:
    en_US:
      web: xpath=(//h2[contains(text(),'Your bank account')])
  addBankDetailsCTAButton:
    en_US:
      web: xpath=//h2[text()='Your bank account']/following-sibling::button
  bankDetailsPopUpTitle:
    en_US:
      web: xpath=//h2[text()='Enter bank account information']
  bankDetailsPopUpSubTitle:
    en_US:
      web: xpath=//div[@class='d-flex flex-column']/child::div/child::div/child::div[1]