elements:
  loginButton:
    en_US:
      web: //button[@data-test-id='desktop-header-user-type-button']
  continueWithEmailCta:
    en_US:
      web: xpath=//button[contains(text(),'Continue with email')]
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  ccpDropDown:
    en_US:
      web: xpath=(//img[@class="header-arrow-down" ])[1]
  ccpLogout:
    en_US:
      web: xpath=//button/span[normalize-space(.)='Logout']
  paymentDuePopUp:
    en_US:
      web: xpath=//*[contains(text(),'Payment reminder')]
  ccpHomePagePaymentDueClose:
    en_US:
      web: xpath=//h2[contains(normalize-space(), 'Payment reminder')]/../preceding-sibling::button
  loginPopUpCloseButton:
    en_US:
      web: xpath=//img[@alt='close']
  continueCTA:
    en_US:
      web: xpath=//button[normalize-space(.)='Continue']
  confirmBusinessDetails:
    en_US:
      web: xpath=//div[@role='dialog']/h2[contains(text(), 'Confirm your business details')]
  accountLabel:
    en_US:
      web: xpath=(//span[text()='Account'])[2]