elements:
  loginButton:
    en_US:
      web: //button[text()='Login']
  loginViaOtp:
    en_US:
      web: //button[@id='login-via-otp']
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  ccpDropDown:
    en_US:
      web: xpath=(//img[@class="header-arrow-down" ])[1]
  ccpLogout:
    en_US:
      web: xpath=//section[@class='drop-body header-custom-width']//div[contains(text(),'Logout')]
  paymentDuePopUp:
    en_US:
      web: xpath=//div[contains(text(),'Payment reminder')]
  ccpHomePagePaymentDueClose:
    en_US:
      web: //button[@aria-label='Close' and contains(@class,'close')]
  loginPopUpCloseButton:
    en_US:
      web: xpath=//img[@alt='close']