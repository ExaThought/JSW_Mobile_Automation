elements:
  # -------- SEARCH --------
  # Homepage trigger that opens the search modal
  searchInput:
    en_US:
      web: //input[@id='SearchText']

  # Real search input rendered inside the modal once it opens
  searchModalInput:
    en_US:
      web: //input[@id='SearchInput']

  searchPlaceholder:
    en_US:
      web: //span[contains(@class,'static-text') and text()='Search']

  rotatingPlaceholder:
    en_US:
      web: //span[contains(@class,'rotating-text')]

  # Suggestion rows inside the search popup overlay
  searchSuggestions:
    en_US:
      web: //div[contains(@class,'search-popup-overlay')]//a[contains(@class,'suggestion-row')]

  # Inner elements of a suggestion row (relative xpaths used inside a card)
  searchResultName:
    en_US:
      web: .//span[contains(@class,'suggestion-text')]

  searchResultImage:
    en_US:
      web: .//img[contains(@class,'suggestion-image')]

  # -------- PRODUCTS --------
  productCard:
    en_US:
      web: //a[contains(@href,'/product-detail')]

  productName:
    en_US:
      web: .//p[contains(@class,'typography')]

  productImage:
    en_US:
      web: .//img
