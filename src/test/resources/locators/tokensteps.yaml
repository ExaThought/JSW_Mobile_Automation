elements:
  mildSteelTitle:
    en_US:
      web: xpath=//h2[@id='mild-steel']
  cartPage:
    en_US:
      web: xpath=//a[contains(@href, '/cart-detail')]
  myRequirementPage:
    en_US:
      web: xpath=//a[@href='/my-requirements']
  myOrderPage:
    en_US:
      web: xpath=//a[@href='/my-orders']
  orderSummaryPage:
    en_US:
      web: xpath=(//div[contains(text(),'View details')])[1]
  # Both keys previously hung off //span[contains(normalize-space(),'Search')], which matches the
  # span AND every ancestor span, and whose first match is a 0x0 duplicate. Resolve the trigger
  # button and the overlay input directly instead. Read the first VISIBLE match - the header
  # renders two copies of this button.
  searchBox:
    en_US:
      web: xpath=//span[text()='Search']/../following-sibling::button
  searchInput:
    en_US:
      web: xpath=//input[@data-slot='input']
  homePageRegisterCta:
    en_US:
      web: xpath=//span[contains(text(),'Register')]
  continueWithEmailCta:
    en_US:
      web: xpath=//button[contains(text(),'Continue with email')]
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  ledgerPage:
    en_US:
      web: //a[contains(@href,'ledger')]/span
  trackMaterialPage:
    en_US:
      web: //a[contains(@href,'track-material')]
  loginButton:
    en_US:
      web: //button[text()='Login']
  accountLabel:
    en_US:
      web: (//span[text()='Account'])[2]
  profileDetails:
    en_US:
      web: xpath=//span[text()='Profile Details']
  confirmBusinessDetails:
    en_US:
      web: xpath=//div[@role='dialog']/h2[contains(text(), 'Confirm your business details')]
  continueCTA:
    en_US:
      web: xpath=//button[normalize-space(.)='Continue']