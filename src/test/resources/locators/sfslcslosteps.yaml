elements:
  loginButton:
    en_US:
      web: //button[@data-test-id='desktop-header-user-type-button']
  loginViaOtp:
    en_US:
      web: //button[@id='login-via-otp']
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  cartPage:
    en_US:
      web: //a[contains(@href, 'cart-detail')]
  # ---------------------------------------------------------------------------
  # Cart detail page.
  #
  # The cart was rewritten from Bootstrap-style utility classes (s-pt-8,
  # d-flex justify-content-between, line-item-attributes) to Tailwind, which killed
  # every class- and id-anchored locator here at once. These are all anchored on
  # VISIBLE TEXT instead - the only thing that survived that rewrite - so they hold
  # across restyling. Do not re-anchor them on generated class names.
  #
  # The page renders a mobile and a desktop copy of the summary blocks, so anything
  # under #payment-breakup or in the billing block matches twice: keep the [1] index.
  # ---------------------------------------------------------------------------
  cartLineItemCashBack:
    en_US:
      web: xpath=(//span[contains(text(),'cashback will be credited')]/parent::span)[1]
  cartLineItemProductAmount:
    en_US:
      web: xpath=(//section//div[contains(@class,'text-right')]/p[1])[1]
  cartLineItemUnitPrice:
    en_US:
      web: xpath=(//section//div[contains(@class,'text-right')]/p[2])[1]
  cartLineItemQuantity:
    en_US:
      web: xpath=(//div[starts-with(normalize-space(text()),'Qty:')])[1]
  cartLineItemName:
    en_US:
      web: xpath=(//a[contains(@href,'product-detail')]/p)[1]
  # Positive signal that the cart rendered line items, e.g. "1 item(s)".
  cartItemCount:
    en_US:
      web: xpath=//p[contains(normalize-space(),'item(s)')]
  # Positive signal that the cart is genuinely empty. Checked only when cartItemCount
  # is absent, so a DOM change to one does not make the other lie. Element-agnostic
  # because the empty state was not in the captured DOM and could not be verified.
  cartEmptyMessage:
    en_US:
      web: xpath=//*[contains(normalize-space(text()),'Your cart is empty')]
  cartShipTo:
    en_US:
      web: xpath=//span[normalize-space()='Delivery address:']/parent::p
  cartBillTo:
    en_US:
      web: xpath=(//p[normalize-space()='Billing address']/following-sibling::p)[4]
  cartLineItemAttributes:
    en_US:
      web: xpath=(//a[contains(@href,'product-detail')]/following-sibling::div[1]/span)[1]
  # --- Payment breakup panel ---
  cartItemTotal:
    en_US:
      web: xpath=(//p[normalize-space()='Item total']/ancestor::div[1]/following-sibling::p)[1]
  cartGstAmount:
    en_US:
      web: xpath=(//p[normalize-space()='GST amount']/ancestor::div[1]/following-sibling::p)[1]
  cartFreightCharges:
    en_US:
      web: xpath=(//p[starts-with(normalize-space(),'Freight charges')]/ancestor::div[1]/following-sibling::p)[1]
  cartSubTotal:
    en_US:
      web: xpath=(//p[normalize-space()='Sub total']/ancestor::div[1]/following-sibling::p)[2]
  ErpPaymentType:
    en_US:
      web: xpath=//p[contains(text(),'Payment type')]/following-sibling::div
  erpOrderNumber:
    en_US:
      web: xpath=//p[contains(text(),'Buyer order')]/following-sibling::div
  erpOrderCategory:
    en_US:
      web: xpath=//p[contains(text(),'Order category')]/following-sibling::div
  erpMMID:
    en_US:
      web: xpath=//tbody[@class='MuiTableBody-root css-1xnox0e']//td[3]
  erpSKUDetails:
    en_US:
      web: xpath=//tbody[@class='MuiTableBody-root css-1xnox0e']//td//p[@class='css-1vg189s']
  erpCashBack:
    en_US:
      web: xpath=//tbody[@class='MuiTableBody-root css-1xnox0e']//td[11]
  erpOrderPaymentType:
    en_US:
      web: xpath=//p[contains(text(),'Order payment type')]/following-sibling::div
  erpOrderQuantity:
    en_US:
      web: xpath=//tbody[@class='MuiTableBody-root css-1xnox0e']//td[6]
  erpTotalAmount:
    en_US:
      web: xpath=//div[@class='MuiBox-root css-11pq19m']//p[contains(text(),'Total order amount')]/following-sibling::p
  erpDeliveryType:
    en_US:
      web: xpath=//p[contains(text(),'Delivery type')]/following-sibling::div
  ccpOrderNumber:
    en_US:
      web: xpath=//div[contains(text(),'Order number')]/following-sibling::div
  ccpCreateOrderCTA:
    en_US:
      web: xpath=//button[normalize-space()='Confirm order']

