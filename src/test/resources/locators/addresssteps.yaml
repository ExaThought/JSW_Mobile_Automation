elements:
  ccpUserMenuTestacco:
    en_US:
      web: xpath=(//button[@id='drop-down-head'])[1]

  ccpUserMenuProfileOption:
    en_US:
      web: //a[@href="/my-profile"]

  ccpProfileAddressesTab:
    en_US:
      web: //button[text()='Addresses']
  ccpProfileAddressesTabActive:
    en_US:
      web: //h2[text()='Bill to']/following-sibling::div[2]//h3

  ccpAddAddressButton:
    en_US:
      web: //button[contains(normalize-space(),'+ Add address')]

  ccpAddressCompanyNameInput:
    en_US:
      web: //input[@id='company']

  ccpAddressLine1Input:
    en_US:
      web: //input[@id="streetLine1"]

  ccpAddressPinCodeInput:
    en_US:
      web: //input[@id="postalCode"]

  ccpAddressCityInput:
    en_US:
      web: //input[@id="city"]
  ccpAddressStateInput:
    en_US:
      web: //input[@id="state"]

  ccpAddressRegionInput:
    en_Us:
      web: //input[@id="region"]

  ccpAddressSaveChangesButton:
    en_US:
      web: //button[text()='Save changes']

  ccpSavedAddressCompanyNameDynamic:
    en_US:
      web: //div[@data-slot="card-content"]//h3

  ccpEditButtonForSavedAddress:
    en_US:
      web:  //h3[text()='${companyName}']/../../following-sibling::div[2]//button



  # ================= DELETE ADDRESS =================

  ccpDeleteButtonForSavedAddress:
    en_US:
      web: //h3[text()='${companyName}']/../following-sibling::button

  # ================= DELETE CONFIRM MODAL =================

  ccpDeleteAddressProceedButton:
    en_US:
      web: //button[text()='Proceed']

  ccpDeleteAddressCancelButton:
    en_US:
      web: //button[text()='Cancel']

  # ================= ERROR MESSAGE =================

  ccpCompanyNameErrorMessage:
    en_US:
      web: //div[normalize-space()='Please enter company name']

  pinCodeErrorMessage:
    en_US:
      web: xpath=//input[@id='pincode']/parent::div/following-sibling::div/child::div
  setAsDefaultShippingAddressCheck:
    en_US:
      web: xpath=//label[text()='Use this as my ship to address']