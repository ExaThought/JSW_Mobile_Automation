elements:
  loginButton:
    en_US:
      web: //button[@id='login-cta']
  loginViaOtp:
    en_US:
      web: //button[@id='login-via-otp']
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  errorMessage:
    en_US:
      web: //p[contains(text(),'Credentials are not valid. Please try again')]
  invalidEmailErrorMessage:
    en_US:
      web: //p[contains(text(),'You have entered a wrong email address')]
  forgotPasswordLink:
    en_US:
      web: //button[contains(normalize-space(), 'Forgot password')]
  forgetPasswordSuccessMessage:
    en_US:
      web: //*[contains(text(),'Password reset link has been sent to your registered email address')]
  continueCTA:
    en_US:
      web: //button[normalize-space(.)='Continue']
  submitCTA:
    en_US:
      web: //button[contains(normalize-space(), 'Submit')]

