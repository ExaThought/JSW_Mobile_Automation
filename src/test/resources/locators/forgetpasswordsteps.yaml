elements:
  loginButton:
    en_US:
      web: //button[@id='login-cta']
  loginViaOtp:
    en_US:
      web: //button[@id='login-via-otp']
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  ccpLoginCTA:
    en_US:
      web: //button[@id='login-to-continue']
  errorMessage:
    en_US:
      web: //div[contains(text(),'Credentials are not valid. Please try again')]
  invalidEmailErrorMessage:
    en_US:
      web: //div[contains(text(),'You have entered a wrong email address')]
  forgotPasswordLink:
    en_US:
      web: //div[contains(@class,'forgot-pwd-link') and contains(text(),'Forgot password?')]


  forgetPasswordSuccessMessage:
    en_US:
      web: //div[contains(text(),'Password reset link has been sent to your registered email address')]

