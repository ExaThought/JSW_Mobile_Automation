elements:
  searchBar:
    en_US:
      web: xpath=//button[contains(@class,'inline-flex') and @data-slot='button']

  searchInput:
    en_US:
      web: xpath=//input[@data-slot='input' and @type='text']

  searchSuggestions:
    en_US:
      web: xpath=//ul[contains(@class,'suggestion')]/li

  searchResults:
    en_US:
      web: xpath=//div[contains(@class,'search-results')]

  productCard:
    en_US:
      web: xpath=//div/a[contains(@class, 'flex') and contains(@class, 'justify-between')]

  productCardplp:
    en_US:
      web: xpath=//img[contains(@class,'object-contain') and contains(@class,'p-2')]

  productName:
    en_US:
      web: xpath=//a[starts-with(@href,'/product-detail/')]//p[contains(@class,'font-semibold')]

  productImage:
    en_US:
      web: xpath=//a[starts-with(@href,'/product-detail/')]//img[contains(@class,'object-contain')]

  viewAllButton:
    en_US:
      web: xpath=//a[contains(@href,'/query')]
