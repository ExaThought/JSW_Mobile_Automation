elements:
  registrationButton:
    en_US:
      web: //button[@id='login-cta']

  ccpRegistrationEmail:
    en_US:
      web: //input[@id='email']

  registrationErrorMessage:
    en_US:
      web:
        - //div[contains(text(),'Credentials are not valid')]
        - //p[contains(text(),'Credentials are not valid. Please try again')]

  invalidRegistrationEmailErrorMessage:
    en_US:
      web: //p[contains(text(),'You have entered a wrong email address')]

  fullName:
    en_US:
      web: //input[@id='fullName']

  mobile:
    en_US:
      web: //input[@id='mobile']

  gstin:
    en_US:
      web: //input[@id='gstin']

  registerNext:
    en_US:
      web: //h2[contains(normalize-space(.), 'Register now')]/following-sibling::form/button

  termsCheckbox:
    en_US:
      web: //input[@id='terms' and @type='checkbox']

  invalidPhoneNumberErrorMessage:
    en_US:
      web: //p[contains(text(),'Please enter correct phone number')]

  invalidGSTINErrorMessage:
    en_US:
      web: //span[contains(@class, 'red-light-text-color')]
      
  checkBox:
    en_US:
      web: xpath=//span[contains(text(),'I agree to JSW')]

  continueCTA:
    en_US:
      web: xpath=//button[normalize-space(.)='Continue']
