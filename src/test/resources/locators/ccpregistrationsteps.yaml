elements:
  registrationButton:
    en_US:
      web: //button[@id='login-cta']

  registrationViaOtp:
    en_US:
      web: //button[@id='login-via-otp']

  ccpRegistrationEmail:
    en_US:
      web: //input[@id='email']



  ccpRegistrationCTA:
    en_US:
      web: //button[@id='login-to-continue']

  registrationErrorMessage:
    en_US:
      web:
        - //div[contains(text(),'Credentials are not valid')]
        - //div[contains(text(),'Credentials are not valid. Please try again')]

  invalidRegistrationEmailErrorMessage:
    en_US:
      web: //div[contains(text(),'You have entered a wrong email address')]

  fullName:
    en_US:
      web: //input[@id='fullName']

  mobile:
    en_US:
      web: //input[@id='mobile']

  gstin:
    en_US:
      web: //input[@id='gstin']

  registerNext:
    en_US:
      web: //button[@id='register-next']

  termsCheckbox:
    en_US:
      web: //input[@id='terms' and @type='checkbox']

  invalidPhoneNumberErrorMessage:
    en_US:
      web: //div[contains(text(),'Please enter correct phone number')]

  invalidGSTINErrorMessage:
    en_US:
      web: //div[contains(text(),'Please enter correct GSTIN for account registration on JSW ONE MSME')]


