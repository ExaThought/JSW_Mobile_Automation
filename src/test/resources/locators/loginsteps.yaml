elements:
  loginButton:
    en_US:
      web: //button[text()="Login"]
  ccpLoginEmail:
    en_US:
      web: //input[@id='email']
  ccpLoginPassword:
    en_US:
      web: //input[@id='password']
  loginViaOtp:
    en_US:
      web: //button[contains(normalize-space(),'Continue with email')]
  ccpLoginCTA:
    en_US:
      web: //button[@type='submit' and normalize-space()='Continue']
  errorMessage:
    en_US:
      web: //div[contains(text(),'Credentials are not valid. Please try again')]
  invalidEmailErrorMessage:
    en_US:
      web: //div[contains(text(),'You have entered a wrong email address')]


