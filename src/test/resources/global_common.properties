# =============================================================================
# Environment-INDEPENDENT configuration.
# Loaded first, then overridden by global_<env>.properties.
# Put a key here only when its value is identical in every environment.
# =============================================================================

# --- Endpoint paths (relative to the env-specific base URLs) ---
ccpTokenUrl=${CCP_TOKEN_URL:auth/login}

# --- OMS/ERP login (Token.getOmsToken). While oms.user.* are blank the framework
# --- falls back to the static omsAuthToken / ErpLoginAuth in the env file.
omsTokenUrl=${OMS_TOKEN_URL:api/authenticate}
omsTokenResponseKey=${OMS_TOKEN_RESPONSE_KEY:}
omsErpRedirectPath=${OMS_ERP_REDIRECT_PATH:oauth2/redirect?token=}

# --- Run-strictness switches ---
# Both were read but never DEFINED, so each fell back to a default buried in Java. Written out
# here with the values already in effect - this changes no behaviour, it just makes the knobs
# visible and overridable per run.
#
# GlobalConfigProperties.checkConfiguredTokenFreshness: warn when omsAuthToken has expired
# rather than aborting, because a stale ERP token should not block a UI-only run. Set true for
# the Jenkins ERP job, where a stale token means the run is meaningless.
failOnExpiredToken=${FAIL_ON_EXPIRED_TOKEN:false}
# DataContractValidator: abort when the API customerId does not match the logged-in user. Strict
# by default - a mismatch means the cart was built for one customer and the browser opened
# another's, and every assertion after that point is measuring the wrong account.
failOnDataContractMismatch=${FAIL_ON_DATA_CONTRACT_MISMATCH:true}

