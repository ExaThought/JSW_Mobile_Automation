# =============================================================================
# Environment-INDEPENDENT configuration.
# Loaded first, then overridden by global_<env>.properties.
# Put a key here only when its value is identical in every environment.
# =============================================================================

# --- Endpoint paths (relative to the env-specific base URLs) ---
ccpTokenUrl=${CCP_TOKEN_URL:auth/login}

# --- OMS/ERP login (Token.getOmsToken). Supply oms.user.* (OMS_USER_EMAIL /
# --- OMS_USER_PASSWORD) and the framework logs in and caches a fresh token. The static
# --- omsAuthToken / ErpLoginAuth fallbacks in the env files are now empty by default,
# --- so one of the two has to be injected for anything OMS-backed to run.
omsTokenUrl=${OMS_TOKEN_URL:api/authenticate}
omsTokenResponseKey=${OMS_TOKEN_RESPONSE_KEY:}
omsErpRedirectPath=${OMS_ERP_REDIRECT_PATH:oauth2/redirect?token=}

# --- JSW One Construct app (single shared instance) ---
appBaseUrl:https://jswoneconstruct.in/
# REMOVED - this held a signed JWT despite the "Url" name, and it was a real bearer credential
# for a PRODUCTION host (jswoneconstruct.in), making it the highest-risk value in the repo.
# Nothing reads it: only appBaseUrl above is consumed (BaseApiImpl:28). Deleted rather than
# blanked because a placeholder for an unread key just invites someone to fill it back in.
# If a caller ever needs it, add appToken=${APP_TOKEN:} and inject the value.
#appTokenUrl=<removed - was a production JWT, rotate it>
